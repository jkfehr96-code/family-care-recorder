
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163a63">
  <title>Family Care - Voice Recorder</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 18px Arial, sans-serif; background: #f1f5f9; color: #17324a; }
    header { background: #163a63; color: white; text-align: center; padding: 19px 14px; }
    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 6px 0 0; color: #dbe8f4; font-size: 16px; }
    main { max-width: 520px; margin: 17px auto; padding: 0 13px 30px; }
    .card { background: white; border-radius: 18px; padding: 21px 17px; box-shadow: 0 3px 14px #0001; }
    .intro { text-align: center; line-height: 1.4; margin: 0 0 12px; font-size: 18px; }
    .timer { text-align: center; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 9px 0 18px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .tile { min-height: 140px; aspect-ratio: 1 / 1; width: 100%; border: 0; border-radius: 16px; color: white; font: bold 22px Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: pointer; padding: 10px; }
    .tile .symbol { font-size: 42px; line-height: 1; }
    .record { background: #c42a36; }
    .stop { background: #255578; }
    .preview { background: #28738a; }
    .publish { background: #07806e; }
    .tile:disabled { background: #cbd5de; color: #607183; cursor: not-allowed; }
    .tile:focus-visible, .small-button:focus-visible { outline: 4px solid #d99a20; outline-offset: 3px; }
    .status { margin-top: 18px; background: #eaf3fa; padding: 15px; border-radius: 12px; text-align: center; line-height: 1.5; }
    .status.error { background: #fff0ee; color: #982d2d; }
    .status.success { background: #e7f7ec; color: #165d35; }
    .playback { display: none; padding-top: 16px; }
    .playback p { margin: 0 0 10px; font-weight: bold; }
    audio { width: 100%; }
    .small-button { width: 100%; margin-top: 15px; border: 1px solid #d1dfea; background: #e9f1f7; color: #173a5b; font: bold 18px Arial, sans-serif; border-radius: 10px; padding: 14px; cursor: pointer; }
    .help { color: #52677c; text-align: center; font-size: 14px; line-height: 1.45; margin: 16px 5px; }
    [hidden] { display: none !important; }
    @media (max-width: 370px) { .tile { min-height: 118px; font-size: 19px; gap: 8px; } .tile .symbol { font-size: 35px; } }
  </style>
</head>
<body>
  <header>
    <h1>Family Care</h1>
    <p>Voice Message Recorder</p>
  </header>
  <main>
    <section class="card">
      <p class="intro">Speak a message for your family.</p>
      <div id="timer" class="timer" aria-label="Recording time">00:00</div>

      <div class="grid">
        <button id="recordButton" class="tile record" type="button">
          <span class="symbol" aria-hidden="true">🔴</span><span id="recordLabel">Record</span>
        </button>
        <button id="stopButton" class="tile stop" type="button" disabled>
          <span class="symbol" aria-hidden="true">■</span><span>Stop</span>
        </button>
        <button id="previewButton" class="tile preview" type="button" disabled>
          <span class="symbol" aria-hidden="true">▶</span><span>Preview</span>
        </button>
        <button id="publishButton" class="tile publish" type="button" disabled>
          <span class="symbol" aria-hidden="true">✓</span><span>Publish</span>
        </button>
      </div>

      <div id="playbackArea" class="playback">
        <p>Listen to your recording:</p>
        <audio id="playback" controls preload="metadata"></audio>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">Ready to record.</div>
      <button id="closeButton" class="small-button" type="button" hidden>Close Recorder</button>
    </section>
    <p class="help">Your recording is shared with your family only after you press Publish.</p>
  </main>

  <script>
    'use strict';

    // The organizer opens this page with a random request ID and
    // its own origin in the URL fragment (not sent to GitHub).
    const launch = new URLSearchParams(location.hash.slice(1));
    const requestId = launch.get('request') || '';
    const requestedOrigin = launch.get('origin') || '';

    function approvedOrganizerOrigin(value) {
      try {
        const u = new URL(value);
        const h = u.hostname.toLowerCase();
        return u.protocol === 'https:' && u.origin === value && (
          h === 'script.google.com' ||
          h === 'script.googleusercontent.com' ||
          h.endsWith('.script.googleusercontent.com') ||
          h.endsWith('-script.googleusercontent.com')
        );
      } catch (_) { return false; }
    }

    const organizerOrigin = approvedOrganizerOrigin(requestedOrigin)
      ? requestedOrigin : '';
    const canContactOrganizer = !!(organizerOrigin && requestId && window.opener);

    const recordButton = document.getElementById('recordButton');
    const stopButton = document.getElementById('stopButton');
    const previewButton = document.getElementById('previewButton');
    const publishButton = document.getElementById('publishButton');
    const recordLabel = document.getElementById('recordLabel');
    const timer = document.getElementById('timer');
    const status = document.getElementById('status');
    const playback = document.getElementById('playback');
    const playbackArea = document.getElementById('playbackArea');
    const closeButton = document.getElementById('closeButton');

    const MAX_BYTES = 5 * 1024 * 1024;
    let connected = false;
    let microphone = null;
    let mediaRecorder = null;
    let pieces = [];
    let audioBlob = null;
    let audioUrl = '';
    let startedAt = 0;
    let durationSeconds = 0;
    let clock = null;
    let requestingMicrophone = false;
    let preparing = false;
    let publishing = false;
    let published = false;
    let publishTimeout = null;

    function tell(text, type = '') {
      status.textContent = text;
      status.className = 'status' + (type ? ' ' + type : '');
    }

    function formatTime(value) {
      const n = Math.max(0, Math.floor(value));
      return String(Math.floor(n / 60)).padStart(2, '0') + ':' +
        String(n % 60).padStart(2, '0');
    }

    function isRecording() {
      return !!mediaRecorder && mediaRecorder.state === 'recording';
    }

    function updateButtons() {
      const busy = requestingMicrophone || preparing || publishing || published;
      recordButton.disabled = busy || isRecording();
      stopButton.disabled = !isRecording() || preparing;
      previewButton.disabled = busy || isRecording() || !audioBlob;
      publishButton.disabled = busy || isRecording() || !audioBlob ||
        audioBlob.size > MAX_BYTES || !connected;
      recordLabel.textContent = audioBlob && !published ? 'Record Again' : 'Record';
      closeButton.hidden = !published;
    }

    function releaseMic() {
      if (microphone) {
        microphone.getTracks().forEach(track => track.stop());
        microphone = null;
      }
    }

    function resetAudio() {
      playback.pause();
      playback.removeAttribute('src');
      playback.load();
      playbackArea.style.display = 'none';
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = '';
      audioBlob = null;
      pieces = [];
      durationSeconds = 0;
      timer.textContent = '00:00';
    }

    function preferredMime() {
      const types = [
        'audio/webm;codecs=opus', 'audio/mp4',
        'audio/ogg;codecs=opus', 'audio/webm'
      ];
      return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
    }

    function send(message) {
      if (!canContactOrganizer || !window.opener || window.opener.closed) {
        return false;
      }
      try {
        window.opener.postMessage({ ...message, requestId }, organizerOrigin);
        return true;
      } catch (_) { return false; }
    }

    async function startRecording() {
      if (requestingMicrophone || preparing || publishing || published || isRecording()) return;
      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
        tell('Your browser cannot record audio. Try Chrome or Safari.', 'error');
        return;
      }

      requestingMicrophone = true;
      updateButtons();
      tell('Allow microphone access if your browser asks.');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        microphone = stream;
        resetAudio();
        const mime = preferredMime();
        const options = mime
          ? { mimeType: mime, audioBitsPerSecond: 64000 }
          : { audioBitsPerSecond: 64000 };
        const recorder = new MediaRecorder(stream, options);
        mediaRecorder = recorder;
        pieces = [];

        recorder.addEventListener('dataavailable', event => {
          if (event.data && event.data.size) pieces.push(event.data);
        });

        recorder.addEventListener('error', () => {
          clearInterval(clock);
          preparing = false;
          releaseMic();
          tell('The recording stopped unexpectedly. Try again.', 'error');
          updateButtons();
        });

        recorder.addEventListener('stop', () => {
          clearInterval(clock);
          releaseMic();
          durationSeconds = Math.max(1, Math.round((performance.now() - startedAt) / 1000));
          timer.textContent = formatTime(durationSeconds);
          preparing = false;
          mediaRecorder = null;
          audioBlob = new Blob(pieces, {
            type: recorder.mimeType || pieces[0]?.type || 'audio/webm'
          });
          pieces = [];

          if (!audioBlob.size) {
            resetAudio();
            tell('No audio was captured. Tap Record to try again.', 'error');
          } else if (audioBlob.size > MAX_BYTES || durationSeconds > 600) {
            tell('This recording is too long. Tap Record Again for a shorter message.', 'error');
          } else {
            audioUrl = URL.createObjectURL(audioBlob);
            playback.src = audioUrl;
            tell(connected
              ? 'Ready! Tap Preview to listen, then Publish to share.'
              : 'Ready! Tap Preview to listen. Open from Family Care Organizer to publish.');
          }
          updateButtons();
        });

        startedAt = performance.now();
        recorder.start(1000);
        clock = setInterval(() => {
          const seconds = (performance.now() - startedAt) / 1000;
          timer.textContent = formatTime(seconds);
          if (seconds >= 590 && isRecording()) stopRecording();
        }, 250);
        tell('Recording now. Speak, then tap Stop.');
      } catch (error) {
        releaseMic();
        tell(error?.name === 'NotAllowedError'
          ? 'Microphone blocked. Allow microphone permission in your browser and try again.'
          : 'Could not start recording. Check your microphone and try again.', 'error');
      } finally {
        requestingMicrophone = false;
        updateButtons();
      }
    }

    function stopRecording() {
      if (!isRecording() || preparing) return;
      preparing = true;
      tell('Preparing your voice message...');
      mediaRecorder.stop();
      releaseMic();
      updateButtons();
    }

    function previewRecording() {
      if (!audioBlob || preparing || publishing) return;
      playbackArea.style.display = 'block';
      playback.currentTime = 0;
      playback.play().catch(() => {
        tell('Tap the Play control below to hear your message.');
      });
    }

    function audioToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const text = String(reader.result || '');
          const comma = text.indexOf(',');
          comma >= 0 ? resolve(text.slice(comma + 1))
            : reject(new Error('Could not read the recording.'));
        };
        reader.onerror = () => reject(new Error('Could not read the recording.'));
        reader.readAsDataURL(blob);
      });
    }

    async function publishRecording() {
      if (!audioBlob || !connected || publishing || published ||
          audioBlob.size > MAX_BYTES || durationSeconds > 600) return;

      publishing = true;
      updateButtons();
      playback.pause();
      tell('Publishing your message to Family Care Organizer...');

      try {
        const mimeType = audioBlob.type || 'audio/webm';
        const base64Audio = await audioToBase64(audioBlob);
        const sent = send({
          type: 'FCO_RECORDER_SAVE',
          recording: {
            title: 'Voice Message',
            category: 'General',
            durationSeconds,
            mimeType,
            base64Audio
          }
        });
        if (!sent) throw new Error('Connection lost. Open the recorder from Family Care Organizer.');

        clearTimeout(publishTimeout);
        publishTimeout = setTimeout(() => {
          if (!publishing) return;
          publishing = false;
          tell('No confirmation received. Check Family Care Organizer before trying Publish again.', 'error');
          updateButtons();
        }, 120000);
      } catch (error) {
        publishing = false;
        tell(error.message || 'Could not publish the recording.', 'error');
        updateButtons();
      }
    }

    window.addEventListener('message', event => {
      if (!canContactOrganizer || event.origin !== organizerOrigin ||
          event.source !== window.opener || !event.data ||
          event.data.requestId !== requestId) return;

      if (event.data.type === 'FCO_RECORDER_CONNECTED') {
        connected = true;
        if (audioBlob && !published) tell('Connected. Preview or Publish your message.');
        updateButtons();
      } else if (event.data.type === 'FCO_RECORDER_SAVED') {
        clearTimeout(publishTimeout);
        publishing = false;
        published = true;
        tell('✓ Published! Your family can now listen to this message.', 'success');
        updateButtons();
      } else if (event.data.type === 'FCO_RECORDER_ERROR') {
        clearTimeout(publishTimeout);
        publishing = false;
        tell(event.data.message || 'Could not publish. Try again.', 'error');
        updateButtons();
      }
    });

    recordButton.addEventListener('click', startRecording);
    stopButton.addEventListener('click', stopRecording);
    previewButton.addEventListener('click', previewRecording);
    publishButton.addEventListener('click', publishRecording);
    closeButton.addEventListener('click', () => {
      window.close();
      tell('Published. You can close this tab.', 'success');
    });

    window.addEventListener('pagehide', () => {
      clearInterval(clock);
      clearTimeout(publishTimeout);
      releaseMic();
    });

    if (canContactOrganizer) {
      let attempts = 0;
      const handshake = setInterval(() => {
        if (connected || attempts >= 20) {
          clearInterval(handshake);
          if (!connected) tell('Recorder opened, but could not connect. Return to Family Care Organizer and reopen it.', 'error');
          return;
        }
        attempts++;
        send({ type: 'FCO_RECORDER_READY' });
      }, 500);
      send({ type: 'FCO_RECORDER_READY' });
    } else {
      tell('Ready to record and preview. To Publish, open this recorder from Family Care Organizer.');
    }

    updateButtons();
  </script>
</body>
</html>
